<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Cetak Kalender Dinding</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="icon"
      href="https://sinergigrafika.com/wp-content/uploads/2019/12/logoonly-sg.png"
      sizes="32x32"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #f8f9fa;
        min-height: 100vh;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      .row {
        text-align: center;
      }

      .header {
        background: linear-gradient(135deg, #0466c8 0%, #0354a0 100%);
        color: white;
        padding: 1rem 0;
        margin-bottom: 30px;
        box-shadow: 0 4px 12px rgba(4, 102, 200, 0.3);
      }
      .header h3 {
        font-weight: 700;
      }

      .card {
        border-radius: 12px;
        border: none;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        margin-bottom: 2rem;
        overflow: hidden;
        transition: all 0.3s ease;
      }
      .card:hover {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      }

      .card-header {
        background: linear-gradient(135deg, #0466c8 0%, #0354a0 100%);
        color: white;
        padding: 1.2rem;
        border: none;
      }
      .card-header h5 {
        margin: 0;
        font-weight: 600;
        font-size: 1.1rem;
      }

      .card-body {
        padding: 1.5rem;
      }

      .form-label {
        font-weight: 500;
        color: #2c3e50;
        margin-bottom: 0.5rem;
      }

      .form-control,
      .form-select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-image: none;
        border: 2px solid #e0e6ed;
        border-radius: 8px;
        padding: 0.5rem 0;
        transition: all 0.3s ease;
        text-align: center;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .form-control:focus,
      .form-select:focus {
        border-color: #0466c8;
        box-shadow: 0 0 0 0.2rem rgba(4, 102, 200, 0.15);
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        appearance: none;
      }

      /* Rekomendasi mesin text */
      .rekomendasi-text {
        font-size: 0.75rem;
        color: #0466c8;
        margin-top: 0.25rem;
        display: block;
        min-height: 1rem;
      }

      .btn-primary {
        background: linear-gradient(135deg, #0466c8 0%, #0354a0 100%);
        border: none;
        padding: 0.7rem 1.5rem;
        font-weight: 500;
        border-radius: 8px;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(4, 102, 200, 0.3);
      }

      .btn-secondary {
        background-color: #6c757d;
        border: none;
        padding: 0.7rem 1.5rem;
        font-weight: 500;
        border-radius: 8px;
        transition: all 0.3s ease;
      }
      .btn-secondary:hover {
        transform: translateY(-2px);
        background-color: #5a6268;
      }

      .table-result td {
        padding: 0.5rem;
        vertical-align: top;
        border-top: 1px solid #dee2e6;
      }
      .table-result tr:first-child td {
        border-top: none;
      }
      .total-row {
        background-color: #f1f8ff;
        font-weight: 600;
      }
      .price-per-piece {
        background-color: #e8f4ff;
      }

      .badge-sm74 {
        background-color: #0466c8 !important;
      }
      .badge-sm66 {
        background-color: #198754 !important;
      }
      .badge-digital {
        background-color: #fd7e14 !important;
      }

      #resultCard {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header text-center">
      <div class="container">
        <h3>
          <i class="fas fa-calendar-alt me-2"></i>Kalkulator Cetak Kalender
          Dinding
        </h3>
      </div>
    </div>

    <div class="container">
      <div
        id="errorAlert"
        class="alert alert-danger"
        role="alert"
        style="display: none"
      ></div>

      <div class="row">
        <!-- Form -->
        <div class="col-md-5">
          <div class="card mb-4">
            <div class="card-header">
              <h5><i class="fas fa-calculator me-2"></i>Hitung Biaya Cetak</h5>
            </div>
            <div class="card-body">
              <form id="calculatorForm">
                <div class="col mb-3">
                  <label for="quantity" class="form-label">
                    <i class="fab fa-buffer me-1"></i>Jumlah / Oplah
                  </label>
                  <input
                    type="number"
                    class="form-control"
                    id="quantity"
                    min="100"
                    step="10"
                    placeholder="Min. 100, kelipatan 10"
                    required
                  />
                  <div class="invalid-feedback">
                    Minimal 100 pcs, kelipatan 10
                  </div>
                </div>

                <div class="col mb-3">
                  <label for="size" class="form-label">
                    <i class="fas fa-ruler me-1"></i>Ukuran Kalender
                  </label>
                  <select class="form-select" id="size" required>
                    <option value="" disabled selected>Pilih ukuran...</option>
                    <option value="32x48 cm">32x48 cm / A3+</option>
                    <option value="38x53 cm">38x53 cm</option>
                    <option value="44x64 cm">44x64 cm</option>
                    <option value="46x64 cm">46x64 cm</option>
                    <option value="custom">Custom...</option>
                  </select>
                  <div class="d-flex my-2 gap-2" id="customSizeWrapper">
                    <input
                      type="number"
                      class="form-control"
                      id="customLebar"
                      min="1"
                      step="0.1"
                      placeholder="Lebar"
                      disabled
                    />
                    <input
                      type="number"
                      class="form-control"
                      id="customPanjang"
                      min="1"
                      step="0.1"
                      placeholder="Panjang"
                      disabled
                    />
                  </div>
                </div>

                <div class="col mb-3">
                  <label for="type" class="form-label">
                    <i class="far fa-calendar me-1"></i>Jenis Kalender
                  </label>
                  <select class="form-select" id="type" required>
                    <option value="" disabled selected>
                      Pilih jenis kalender...
                    </option>
                    <option value="1">Bulanan (1 lembar)</option>
                    <option value="3">Caturwulan (3 lembar)</option>
                    <option value="4">Triwulan (4 lembar)</option>
                    <option value="5">Triwulan + Cover (5 lembar)</option>
                    <option value="6">Dwiwulan (6 lembar)</option>
                    <option value="7">Dwiwulan + Cover (7 lembar)</option>
                    <option value="12">Bulanan (12 lembar)</option>
                    <option value="13">Bulanan + Cover (13 lembar)</option>
                  </select>
                </div>

                <div class="col mb-3">
                  <label for="paper" class="form-label">
                    <i class="fas fa-file me-1"></i>Jenis Kertas
                  </label>
                  <select class="form-select" id="paper" required>
                    <option value="" disabled selected>
                      Pilih jenis kertas...
                    </option>
                    <option value="hvs70">HVS 70gsm</option>
                    <option value="hvs80">HVS 80gsm</option>
                    <option value="hvs100">HVS 100gsm</option>
                    <option value="ap120">Art Paper 120gsm</option>
                    <option value="ap150">Art Paper 150gsm</option>
                    <option value="ac210">Art Carton 210gsm</option>
                    <option value="ac230">Art Carton 230gsm</option>
                    <option value="ac260">Art Carton 260gsm</option>
                  </select>
                </div>

                <div class="row mb-3">
                  <div class="col">
                    <label for="lamination" class="form-label">
                      <i class="fab fa-buffer me-1"></i>Laminasi
                    </label>
                    <select class="form-select" id="lamination" required>
                      <option value="" disabled selected>
                        Pilih laminasi...
                      </option>
                      <option value="none">Tidak Ada</option>
                      <option value="doff">Doff</option>
                      <option value="glossy">Glossy</option>
                    </select>
                  </div>
                  <div class="col">
                    <label for="finishing" class="form-label">
                      <i class="fas fa-stapler me-1"></i>Finishing
                    </label>
                    <select class="form-select" id="finishing" required>
                      <option value="" disabled selected>
                        Pilih finishing...
                      </option>
                      <option value="Jepit Seng">Jepit Seng</option>
                      <option value="Spiral">Spiral</option>
                    </select>
                  </div>

                  <!-- Mesin Cetak — dengan teks rekomendasi di bawahnya -->
                </div>
                <div class="col mb-3">
                  <label for="mesinPilihan" class="form-label">
                    <i class="fas fa-print me-1"></i>Mesin Cetak
                  </label>
                  <select
                    class="form-select"
                    id="mesinPilihan"
                    name="mesinPilihan"
                    required
                    disabled
                  >
                    <option value="" disabled selected>Pilih opsi...</option>
                    <option value="Digital Printing">Digital Printing</option>
                    <option value="SM-66">Speedmaster-66</option>
                    <option value="SM-74">Speedmaster-74</option>
                  </select>
                  <div id="rekomendasiMesin" class="rekomendasi-text"></div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-calculator me-2"></i>Hitung Biaya
                  </button>
                  <button type="button" id="resetBtn" class="btn btn-secondary">
                    <i class="fas fa-redo me-2"></i>Reset
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Hasil -->
        <div class="col-md-7">
          <div id="resultCard" class="card">
            <div class="card-header">
              <h5><i class="fas fa-receipt me-2"></i>Hasil Kalkulasi</h5>
            </div>
            <div class="card-body">
              <div class="alert alert-info" role="alert">
                <h5 class="alert-heading mb-0">
                  Mesin yang digunakan:
                  <span id="mesinBadge" class="badge"></span>
                </h5>
              </div>
              <div class="table-responsive">
                <table class="table table-result">
                  <tbody>
                    <tr>
                      <td><strong>Jumlah Cetak</strong></td>
                      <td id="jumlahCetak">-</td>
                    </tr>
                    <tr>
                      <td><strong>Bahan</strong></td>
                      <td id="bahan">-</td>
                    </tr>
                    <tr>
                      <td><strong>Finishing</strong></td>
                      <td id="finishingInfo">-</td>
                    </tr>
                    <tr>
                      <td colspan="2" style="padding: 15px; border: 0px"></td>
                    </tr>
                    <tr class="total-row">
                      <td><strong>Total Biaya</strong></td>
                      <td id="totalBiaya">-</td>
                    </tr>
                    <tr class="price-per-piece">
                      <td><strong>Harga Satuan</strong></td>
                      <td id="hargaPerBuah">-</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="text-center text-muted py-4">
        <p>
          <i class="fas fa-copyright me-1"></i
          ><span id="tahun-dinamis"></span> PT. Smart Media Prima
        </p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById("tahun-dinamis").innerHTML =
        new Date().getFullYear();
    </script>
    <script src="script2.js"></script>
  </body>
</html>
